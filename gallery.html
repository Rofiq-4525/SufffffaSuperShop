<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery | সুফ্ফা সুপারশপ</title>
  <style>
    body {
      margin: 0;
      font-family: 'Hind Siliguri', sans-serif;
      background: linear-gradient(180deg, #fffdf9 0%, #f8f2ea 100%);
      color: #221D1A;
    }
    .wrap {
      max-width: 1000px; margin: 40px auto; padding: 24px 18px;
    }
    .card {
      background: #fff; border: 1px solid #E8DDCB; border-radius: 16px;
      box-shadow: 0 10px 24px rgba(18,60,102,0.06); padding: 24px;
    }
    h1 {
      margin: 0 0 16px; color: #123C66; font-size: 32px;
    }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px;
    }
    .item {
      background: #F6EFE2; border: 1px solid #E8DDCB; border-radius: 14px; min-height: 160px;
      display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 700; color: #123C66; padding: 16px;
    }
    .back {
      display: inline-block; margin-bottom: 18px; text-decoration: none; color: #123C66; font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← Back to Home</a>
    <div class="card">
      <h1>Gallery</h1>
      <div class="grid">
        <div class="item">ফ্রেশ ফুড</div>
        <div class="item">মশলা বাজার</div>
        <div class="item">স্টোর ফটো</div>
        <div class="item">পণ্য স্টক</div>
        <div class="item">গ্রাহক সেবা</div>
        <div class="item">সুপারশপ</div>
      </div>
    </div>
  </div>
</body>
</html>
