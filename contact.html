<!DOCTYPE html>

  <style>
    body {
      margin: 0;
      font-family: 'Hind Siliguri', sans-serif;
      background: linear-gradient(180deg, #fffdf9 0%, #f8f2ea 100%);
      color: #221D1A;
    }
    .wrap {
      max-width: 900px; margin: 40px auto; padding: 24px 18px;
    }
    .card {
      background: #fff; border: 1px solid #E8DDCB; border-radius: 16px;
      box-shadow: 0 10px 24px rgba(18,60,102,0.06); padding: 24px;
    }
    h1 {
      margin: 0 0 12px; color: #123C66; font-size: 32px;
    }
    .info {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-top: 16px;
    }
    .box {
      background: #F6EFE2; border: 1px solid #E8DDCB; border-radius: 12px; padding: 16px;
    }
    .box strong { display: block; margin-bottom: 6px; color: #123C66; }
    .box a {
      color: #123C66; text-decoration: none; font-weight: 700;
    }
    .box .icon {
      display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px;
      border-radius:50%; background:#fff; border:1px solid #E8DDCB; margin-bottom:8px; font-size:16px;
    }
    .back {
      display: inline-block; margin-bottom: 18px; text-decoration: none; color: #123C66; font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="wrap">
